<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="CRESCPEL everyday products collection">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#hg)"/>
  <circle cx="300" cy="300" r="230" fill="#dcfce7"/>
  <circle cx="300" cy="300" r="160" fill="#ffffff"/>

  <!-- book -->
  <g transform="translate(180 200)">
    <rect x="-50" y="-36" width="46" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <rect x="4" y="-36" width="46" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <rect x="-40" y="-24" width="14" height="14" rx="3" fill="#22c55e"/>
    <circle cx="27" cy="-12" r="8" fill="#16a34a"/>
  </g>

  <!-- storage jar -->
  <g transform="translate(410 210)">
    <path d="M-40 -16 Q-40 -34 -22 -34 L22 -34 Q40 -34 40 -16 L34 44 Q33 56 21 56 L-21 56 Q-33 56 -34 44 Z" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <ellipse cx="0" cy="-16" rx="40" ry="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>
    <circle cx="-10" cy="18" r="14" fill="#22c55e"/>
    <circle cx="14" cy="26" r="11" fill="#16a34a"/>
  </g>

  <!-- lid -->
  <g transform="translate(300 410)">
    <path d="M-80 24 Q-80 -34 0 -34 Q80 -34 80 24 Z" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <ellipse cx="0" cy="24" rx="80" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <rect x="-12" y="-48" width="24" height="12" rx="6" fill="#22c55e"/>
  </g>

  <!-- nail cutter -->
  <g transform="translate(175 400)">
    <rect x="-22" y="-44" width="44" height="88" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <circle cx="0" cy="-20" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="-12" y="14" width="24" height="8" rx="4" fill="#22c55e"/>
  </g>

  <!-- air fryer liner -->
  <g transform="translate(425 400)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#16a34a" stroke-width="4" stroke-dasharray="7 8"/>
    <circle cx="-12" cy="-8" r="7" fill="#22c55e"/>
    <circle cx="12" cy="6" r="8" fill="#16a34a"/>
    <circle cx="6" cy="-14" r="5" fill="#86efac"/>
  </g>
</svg>
